# --- Struktur artikel: urutan kepala bagian + formula pemandu ---
kepala_bagian:
  - {id: pendahuluan, judul: Pendahuluan, formula_id: tujuan}
  - {id: metode, judul: Metode Penelitian, formula_id: metode}
  - {id: hasil, judul: Hasil dan Pembahasan, formula_id: hasil}
  - {id: simpulan, judul: Simpulan dan Saran, formula_id: simpulan}
  - {id: ucapan, judul: Ucapan Terima Kasih}
  - {id: pustaka, judul: Daftar Pustaka}

varian_kepala:
  pendahuluan: [Pendahuluan, PENDAHULUAN, Introduction, INTRODUCTION]
  metode: [Metode, METODE, Metode Penelitian, METODE PENELITIAN, Metodologi, Metodologi Penelitian, METODOLOGI PENELITIAN, Method, METHOD, Methods, METHODS, Methodology, METHODOLOGY, Materials and Methods, RESEARCH METHOD, RESEARCH METHODS, Research Methods]
  hasil: [Hasil, HASIL, Hasil dan Pembahasan, HASIL DAN PEMBAHASAN, Hasil Penelitian, Pembahasan, PEMBAHASAN, Analisis, Results and Discussion, Results and Discussions, Results And Discussion, RESULTS AND DISCUSSIONS, Result and discussion, Result, RESULT, RESULTS, RESEARCH RESULTS, Findings, FINDINGS, Experimental Results and Evaluation, Discussion, DISCUSSION, DISCUSSION AND RESULT]
  simpulan: [Simpulan dan Saran, Kesimpulan dan Saran, KESIMPULAN DAN SARAN, Kesimpulan, KESIMPULAN, Kesimpulan dan Rekomendasi, KESIMPULAN DAN REKOMENDASI, Simpulan, Penutup, PENUTUP, Conclusion, CONCLUSIONS, Conclusions, Conclusion and Recommendation, CONCLUSION AND RECOMMENDATION, CONCLUSION AND RECOMMENDATIONS]
  pustaka: [Daftar Pustaka, DAFTAR PUSTAKA, Referensi, REFERENSI, References, REFERENCES]

