# --- Abstrak ---
abstrak:
  label: Abstrak
  label_varian: [Abstrak, ABSTRAK, Abstract, ABSTRACT, "Abstrak−", "Abstract−"]
  komponen: [latar belakang, tujuan, metode, hasil, simpulan]
  panjang_kata: [100, 250]
  panjang_kata_teramati: [138, 367]
  kata_kunci: "Kata Kunci:"
  kata_kunci_varian: ["Kata kunci:", "Kata Kunci:", "Kata kunci :", "Kata Kunci :", "Kata Kunci –", "Kata kunci—", "Keyword :", "Keywords:", "Keywords :", "Keywords –", "Keywords—"]
  pemisah_kata_kunci: [",", ";"]
  struktur_varian: ["satu paragraf naratif", "terstruktur (Background/Objective/Methods/Results/Conclusion)", "terstruktur (Purpose/Methods/Results/Novelty)"]
  dwibahasa: "10/29 paper memuat Abstrak + Abstract"
  pembuka_teramati: ["Penelitian ini mengkaji …", "Penelitian ini menganalisis …", "Penelitian ini bertujuan untuk …", "Studi ini bertujuan untuk …", "Data berasal dari …", "This study presents …", "This paper evaluates …"]
  larangan: [sitasi, singkatan, catatan kaki]

# --- Kutipan ---
kutipan:
  gaya_default: apa_nama_tahun
  gaya_korpus: numerik_kurung
  contoh_apa: ["Menurut X (2020), …", "X (2020) menyatakan bahwa …", "(X, 2020)", "(X, 2020; Y, 2021)"]
  contoh_numerik: ["… [1]", "… [2], [3]", "… [7]–[9]", "… [1]-[3]", "… [7] -[12]", "… [4-7]", "… [2-4]"]
  paper_numerik: [s1-register, s1-telkomnika, s2-ijccs, s2-ilkom, s2-jiki, s2-jisebi, s2-jti, s2-resti, s2-sji, s3-coreit, s3-juti, s3-mib, s3-sisfokom, s3-sistemasi, s4-jsi, s4-scan, s4-sitekin, s4-transformatika, s5-jatisi, s5-misi, s5-nuansa, s6-jupiter, s6-jutik]
  paper_apa: [s2-jptk, s2-jsinbis, s2-jtie, s3-jsce, s3-jsi-ui, s3-sinkron]

daftar_pustaka:
  gaya_default: APA
  gaya_korpus: numerik
  paper_apa: [s2-jptk, s2-jsinbis, s2-jtie, s3-jsce, s3-jsi-ui, s3-sinkron]
